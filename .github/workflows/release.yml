name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Modules/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          make install_dependencies
          make external_contributor

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project podcasts.xcodeproj \
            -scheme pocketcasts \
            -destination 'generic/platform=iOS' \
            -archivePath build/AudioPouch.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Package IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/AudioPouch.xcarchive/Products/Applications/*.app/Info.plist)
          cd build/AudioPouch.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -qry "$GITHUB_WORKSPACE/AudioPouch-$VERSION.ipa" Payload
          echo "IPA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPouch-${{ env.IPA_VERSION }}
          path: AudioPouch-*.ipa
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          pattern: AudioPouch-*
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## AudioPouch 1.0

          First AudioPouch release, forked from Pocket Casts iOS (MPL-2.0).

          ### Install

          The IPA is **unsigned**. Install it on a device by re-signing with a
          free Apple ID via AltStore or Sideloadly, or with your own Apple
          Developer certificate. It will not install via plain AirDrop/Files.

          ### Highlights

          - Show-notes and podcast-description HTML sanitized; JavaScript disabled in show-notes web views
          - `pktc://` deep links require confirmation before promo redemption and OPML import
          - Accessibility: localized strings, labels/identifiers, relaxed Dynamic Type caps
          - Branch-based Swift packages pinned to exact revisions
          - Stale Firebase/Sentry release tooling removed
          - New AudioPouch app icon
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" AudioPouch-*.ipa --title "AudioPouch ${GITHUB_REF_NAME}" --notes-file release-notes.md
